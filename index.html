<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TriBrach — Level It Right</title>
<meta name="description" content="Level a tribrach by turning its three leveling screws. A TotalStationTech field trainer.">

<style>
/* ==========================================================================
   TriBrach — Level It Right
   --------------------------------------------------------------------------
   ONE self-contained file. No build step, no bundler, no framework. The only
   things it loads are the layer sprites under assets/img/, over plain relative
   paths, which is why it still runs straight off file:// in the test suite.

   THE STAGE. Both art screens were drawn on a single 1920x1080 canvas and
   every layer in the package is registered to it, so the whole layout lives in
   "design pixels" and one transform scales the lot to fit the viewport. That
   is the entire responsive strategy: no breakpoints, no reflow, nothing to
   keep in sync. The field report and the toast sit OUTSIDE the stage and stay
   ordinary responsive DOM, because shrinking a table of numbers by the same
   factor as the artwork makes it unreadable on a phone.
   ========================================================================== */

:root{
  --yellow:      #f5c218;
  --yellow-lit:  #ffdc55;
  --yellow-dim:  #a8820c;
  --lcd-green:   #0ae805;   /* sampled from Stake-Out's digit atlas */
  --ink:         #05060a;
  --font-display:'Arial Narrow','Helvetica Neue Condensed','Helvetica Neue',Arial,sans-serif;
  --font-mono:   'Courier New',Consolas,'Liberation Mono',monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--ink);
  color:#e8e8ea;
  font-family:var(--font-display);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* ---- the letterbox -------------------------------------------------------
   #app is the viewport; #stage is the 1920x1080 design canvas, moved and
   scaled into it by JS. transform-origin is the top-left corner so the maths
   is a plain "offset then scale" with nothing to unpick. */
#app{position:fixed;inset:0;overflow:hidden;background:#000}
#stage{
  position:absolute;left:0;top:0;
  width:1920px;height:1080px;
  transform-origin:0 0;
  will-change:transform;
}

.screen{display:none}
#stage .screen{position:absolute;inset:0}
#stage .screen.is-on{display:block}

/* Every static art layer is an absolutely positioned image at its measured
   spot on the design canvas. Positions come from assets/img/README.txt and are
   written into the SPRITES table below — nothing here is hand-placed. */
.ly{position:absolute;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}

/* Portrait menu only. The site photo is scaled to the canvas width and left at
   the top; this carries it down into the dark so the stacked buttons below sit
   on clean ink. Cropping the photo to cover a canvas this tall instead would
   throw away the crane skyline, which is most of what the shot is for. */
#menuFade{
  position:absolute;display:none;pointer-events:none;z-index:1;
  /* Fully opaque by 29% of 2300 = 667px, which is just above where the photo
     ends at 675. Any later and the bright sunset in the shot pushes through
     behind the wordmark; any earlier and the cranes are gone. */
  background:linear-gradient(to bottom,
    rgba(5,6,10,0) 0%, rgba(5,6,10,0) 9%, rgba(5,6,10,.62) 20%,
    #05060a 29%, #05060a 100%);
}

#rig{
  position:absolute;
  touch-action:none;            /* without this the browser eats the drag */
  cursor:grab;
}
#rig.is-turning{cursor:grabbing}
#hudfx{position:absolute;pointer-events:none}

/* ---- art buttons ---------------------------------------------------------
   A real <button>, transparent, sitting exactly on its layer's rectangle with
   the layer art as its only content. Keeps the whole thing keyboard-reachable
   and screen-reader-sane, which a canvas hit-test would not. */
.artbtn{
  position:absolute;padding:0;border:0;background:none;
  cursor:pointer;display:block;-webkit-tap-highlight-color:transparent;
}
.artbtn img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.artbtn:focus-visible{outline:3px solid var(--yellow);outline-offset:4px;border-radius:6px}

/* Difficulty plates. The art gives one state per tier, so selection has to be
   drawn: unpicked tiers are dimmed, the picked one gets its full colour back
   plus a glow that follows the plate's alpha rather than its bounding box. */
.lvl img{
  filter:brightness(.52) saturate(.6);
  transition:filter .13s ease;
}
.lvl:hover img{filter:brightness(.8) saturate(.85)}
.lvl[aria-checked="true"] img{
  filter:brightness(1.04)
         drop-shadow(0 0 9px rgba(245,194,24,.95))
         drop-shadow(0 0 24px rgba(245,194,24,.5));
}
#startBtn img,#escBtn img,#tstBtn img{transition:filter .13s ease}
#startBtn:hover img{filter:brightness(1.12) drop-shadow(0 0 16px rgba(245,194,24,.55))}
#escBtn:hover img{filter:brightness(1.15)}
#tstBtn:hover img{filter:brightness(1.25)}

/* ---- play-screen overlay -------------------------------------------------
   The new art has no home for the setup counter, the tolerance reminder or the
   log-as-is control, so they live in the empty dark column under the escape
   button. Sized in design pixels like everything else on the stage. */
.ov{position:absolute;pointer-events:none;font-family:var(--font-display)}
#hudLevel{
  left:1480px;top:316px;width:396px;height:52px;
  font-size:34px;font-weight:700;letter-spacing:3px;color:var(--yellow);
  text-align:center;line-height:52px;text-transform:uppercase;
  text-shadow:0 0 18px rgba(245,194,24,.35);
  white-space:nowrap;overflow:hidden;
}
#hudSetup{
  left:1480px;top:624px;width:396px;height:40px;
  font-size:28px;font-weight:700;letter-spacing:4px;color:#e9e9ec;
  text-align:center;line-height:40px;
}
#hudTol{
  left:1480px;top:666px;width:396px;height:32px;
  font-size:21px;letter-spacing:3px;color:#8d8f98;text-align:center;line-height:32px;
}
#logBtn{
  position:absolute;left:1524px;top:714px;width:308px;height:74px;
  font-family:var(--font-display);font-size:25px;font-weight:700;letter-spacing:3px;
  color:#ffd9d9;background:linear-gradient(#3a1414,#240c0c);
  border:2px solid #7d2020;border-radius:9px;cursor:pointer;
}
#logBtn:hover{background:linear-gradient(#4d1a1a,#2d0f0f)}
#logBtn.armed{color:#fff;background:linear-gradient(#a81f1f,#6e1212);border-color:#e04a4a}

/* Screen-reader / test mirror of the values the LCD paints. Present in the
   DOM and accurate, just not shown — the canvas glyphs are decoration. */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* ---- rotate advisory -----------------------------------------------------
   Deliberately NOT a gate. A modal here would block the game behind it, and a
   phone held upright is cramped rather than unplayable, so this says its piece
   and gets out of the way. */
#rotate{
  position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:none;justify-content:center;pointer-events:none;z-index:30;
}
#rotate span{
  background:rgba(8,9,14,.9);border:1px solid var(--yellow-dim);border-radius:999px;
  color:var(--yellow);font-size:12px;letter-spacing:2.5px;padding:8px 18px;
}
body.is-portrait.is-playing #rotate{display:flex}

/* ---- field report --------------------------------------------------------
   Outside the stage on purpose (see the note at the top). */
#screen-report{
  position:fixed;inset:0;z-index:40;background:#0a0b10;
  overflow-y:auto;padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 22px);
}
#screen-report.is-on{display:flex;flex-direction:column;align-items:center}
.badge{
  display:inline-block;background:var(--yellow);color:#000;font-size:11px;font-weight:700;
  letter-spacing:3px;padding:5px 12px;border-radius:3px;
}
.ticket{
  width:100%;max-width:620px;margin-top:16px;background:#111319;
  border:1px solid #23262f;border-radius:10px;overflow:hidden;
}
.ticket .th{padding:14px 16px;border-bottom:1px solid #23262f;background:#15181f}
.ticket .th .t{font-size:17px;font-weight:700;letter-spacing:3px;color:var(--yellow)}
.ticket .th .s{font-size:11px;letter-spacing:1.6px;color:#82858f;margin-top:5px}
.ticket table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:12.5px}
.ticket th{
  text-align:left;padding:9px 16px;background:#191c24;color:#9a9da6;
  font-family:var(--font-display);font-size:11px;letter-spacing:2px;
}
.ticket td{padding:9px 16px;border-top:1px solid #1d2028;color:#d6d8de}
.ticket td.p{color:#3ddc5a;font-weight:700}
.ticket td.f{color:#ff5f5f;font-weight:700}
.ticket .tot{
  display:flex;justify-content:space-between;padding:13px 16px;
  border-top:1px solid #23262f;background:#15181f;
  font-size:12px;letter-spacing:2px;color:var(--yellow);
}
.rptbar{display:flex;gap:10px;margin-top:16px;width:100%;max-width:620px}
.btn{
  flex:1;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:2.5px;
  padding:14px 16px;border-radius:7px;cursor:pointer;
  background:#1b1e26;color:#e8e8ea;border:1px solid #333744;
}
.btn:hover{background:#242833}
.btn.primary{background:var(--yellow);color:#000;border-color:var(--yellow-dim)}
.btn.primary:hover{background:var(--yellow-lit)}

/* ---- toast --------------------------------------------------------------- */
.toast{
  position:fixed;left:50%;top:18px;transform:translateX(-50%);
  background:#12141b;border:1px solid #2c3040;border-radius:7px;
  padding:11px 20px;font-size:13px;font-weight:700;letter-spacing:2px;
  opacity:0;transition:opacity .18s ease;pointer-events:none;z-index:60;white-space:nowrap;
}
.toast.is-on{opacity:1}

/* Legal links. Deliberately outside #stage: the menu is a measured sprite
   canvas that gets scaled by a transform, and anything added inside it would
   have to be placed in both the landscape and portrait layout tables. This is
   plain viewport-fixed chrome instead, shown only on the menu. */
#legalBar{
  display:none;
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:6px 12px calc(6px + env(safe-area-inset-bottom));
  text-align:center;font-size:11px;letter-spacing:.4px;
  color:rgba(255,255,255,.42);
  background:linear-gradient(to top, rgba(5,6,10,.85), rgba(5,6,10,0));
  pointer-events:none;
}
body.is-menu #legalBar{display:block}
#legalBar a{color:rgba(255,255,255,.62);text-decoration:none;pointer-events:auto}
#legalBar a:hover,#legalBar a:focus-visible{color:var(--yellow)}
.toast.ok{border-color:#2f8f3f;color:#7dffa0}
.toast.no{border-color:#8f2f2f;color:#ff9a9a}

@media (prefers-reduced-motion:reduce){
  .lvl img,#startBtn img,#escBtn img,#tstBtn img,.toast{transition:none}
}
</style>
</head>

<body>

<div id="app">
  <div id="stage">

    <!-- ======================= START MENU =======================
         Layer order, bottom to top: 01 background, 02 hero tribrach,
         03 title, 04 TST return, 05-08 difficulty, 09 start, 10 copy.
         The decorative layers are built from the SPRITES table at boot; only
         the things you can actually press are written out here. -->
    <section id="screen-menu" class="screen is-on">
      <div id="menuFade" aria-hidden="true"></div>
      <a  id="tstBtn"  class="artbtn" href="https://totalstationtech.com"
          aria-label="Total Station Tech — back to the main site"></a>
      <div id="lvlList" role="radiogroup" aria-label="Difficulty"></div>
      <button id="startBtn" class="artbtn" type="button">
        <span class="sr">Start</span>
      </button>
    </section>

    <!-- ======================= PLAY =======================
         01 static UI, then #rig (layers 02-05, live), then #hudfx
         (layers 06-07, live), then 08 labels, 09 branding, 10 escape. -->
    <section id="screen-play" class="screen">
      <canvas id="rig" width="1000" height="1000" role="application"
              aria-label="Tribrach. Drag a leveling screw to turn it."></canvas>
      <canvas id="hudfx" width="1920" height="1080" aria-hidden="true"></canvas>

      <button id="quitBtn" class="artbtn" type="button">
        <span class="sr">Escape to main menu</span>
      </button>

      <div class="ov" id="hudLevel">—</div>
      <div class="ov" id="hudSetup">SETUP 1 OF 2</div>
      <div class="ov" id="hudTol">TOL 30%</div>
      <button id="logBtn" type="button">LOG AS-IS</button>

      <span class="sr" id="hudClock">00:00:00</span>
      <span class="sr" id="rdOffset">—</span>
      <span class="sr" id="rdHold">0.0s</span>
    </section>

  </div>
</div>

<!-- ==================== FIELD REPORT ====================
     Kept outside the stage so its numbers stay legible at any size. -->
<section id="screen-report" class="screen">
  <span class="badge">FIELD REPORT</span>
  <div class="ticket" id="ticket"></div>
  <div class="rptbar">
    <button id="againBtn" class="btn primary" type="button">RUN IT AGAIN</button>
    <button id="menuBtn" class="btn" type="button">MENU</button>
  </div>
</section>

<div id="rotate"><span>TURN YOUR PHONE SIDEWAYS FOR A BIGGER RIG</span></div>

<!-- Legal links for the training simulator. No consent gate: nothing is
     uploaded and nothing here feeds field layout. -->
<div id="legalBar">
  <a href="https://totalstationtech.com/terms.html" target="_blank" rel="noopener">Terms</a> &middot;
  <a href="https://totalstationtech.com/privacy.html" target="_blank" rel="noopener">Privacy</a> &middot;
  <a href="https://totalstationtech.com/disclaimer.html" target="_blank" rel="noopener">Disclaimer</a>
</div>
<div class="toast" id="toast"></div>

<script id="tribrach-sim">
/* ==========================================================================
   TribrachSim — the physics core.
   --------------------------------------------------------------------------
   Deliberately separated from anything that touches the DOM so it can be
   driven headless by the acceptance tests. Namespaced rather than dumped on
   the global scope because this is meant to sit alongside Stake-Out in a
   surveying-games collection later, and two games sharing a `bubble` global
   would be a bad afternoon.

   COORDINATE CONVENTION — read this before debugging any sign error.
   Everything in here is MATH convention: +x right, +y UP, angles measured
   counter-clockwise from +x. That is what makes the screw angles below read
   the way a surveyor would draw them on paper. The renderer is the only place
   that flips to screen space (+y down), and it does it in exactly one line.
   ========================================================================== */
(function (root) {
  'use strict';

  /* ---- the three leveling screws --------------------------------------- */
  /* 120 degrees apart. A upper-left, B upper-right, C bottom — matching both
     the reference render and where the knobs actually get drawn. */
  var PHI_DEG = { A: 150, B: 30, C: 270 };

  var RAD = Math.PI / 180;

  /* Each screw's fixed bubble-motion direction, d_i = [cos φ_i, sin φ_i].
     Raising screw i tilts the plate down away from it, and a bubble floats to
     the HIGH side — so the bubble moves TOWARD the screw you raise. That is
     why d_i simply points at where the screw sits.

        d_A = (-0.866,  0.5)
        d_B = ( 0.866,  0.5)
        d_C = ( 0.000, -1.0)

     Note these three sum to (0,0). That is not a coincidence and it is not
     decorative: it is acceptance criterion 3. Turning all three screws the
     same amount raises the whole plate without tilting it, so the bubble does
     not move at all. If you ever "fix" these numbers and that stops being
     true, you have broken the game. */
  var DIRS = [
    { id: 'A', phi: PHI_DEG.A, x: Math.cos(PHI_DEG.A * RAD), y: Math.sin(PHI_DEG.A * RAD) },
    { id: 'B', phi: PHI_DEG.B, x: Math.cos(PHI_DEG.B * RAD), y: Math.sin(PHI_DEG.B * RAD) },
    { id: 'C', phi: PHI_DEG.C, x: Math.cos(PHI_DEG.C * RAD), y: Math.sin(PHI_DEG.C * RAD) }
  ];

  /* Handedness, one entry per screw, in A/B/C order. Positive q is a CLOCKWISE
     turn of that knob as the player sees it. +1 means clockwise raises that
     corner, which is the real-tribrach convention and the starting default.
     If playtesting says the whole rig feels backwards, flip these three to -1
     and change nothing else. If ONE knob feels backwards, flip that one. */
  var KNOB_SENSE = [1, 1, 1];

  /* Bubble travel per radian of knob rotation, in vial radii. Pure feel, dialed
     in by hand exactly like Stake-Out's tilt sensitivity — there is no correct
     value. At 0.16 a quarter turn walks the bubble about a quarter of the way
     out, and a full turn takes it from dead centre to the rim. */
  var K = 0.16;

  /* Screws bottom out. Generous — 2.5 turns each way is far more than any
     setup needs — but it stops a bored player from winding a knob to infinity
     and it gives the renderer something honest to show at the stops. */
  var MAX_TRAVEL_RAD = 2.5 * 2 * Math.PI;

  /* ---- the vector maths the acceptance criteria are about ---------------- */
  /* T = K * (q_A*d_A + q_B*d_B + q_C*d_C)
     q_i is TOTAL accumulated rotation of knob i in radians, not a delta — the
     bubble's target is a pure function of where the three screws currently
     sit, the way a real plate's tilt is. */
  function targetFor(qA, qB, qC) {
    var q = [qA, qB, qC], tx = 0, ty = 0;
    for (var i = 0; i < 3; i++) {
      var s = q[i] * KNOB_SENSE[i];
      tx += s * DIRS[i].x;
      ty += s * DIRS[i].y;
    }
    return { x: K * tx, y: K * ty };
  }

  /* The inverse, for building a starting setup: given where we want the bubble
     to sit, what screw positions put it there? Underdetermined — two equations,
     three screws — so take the minimum-norm solution. The three unit vectors
     form a tight frame with sum(d_i d_i^T) = (3/2)I, which collapses the whole
     pseudo-inverse to this one line:  q_i = (2/3) * (T/K) . d_i  */
  function screwsFor(tx, ty) {
    var vx = tx / K, vy = ty / K;
    var out = [];
    for (var i = 0; i < 3; i++) {
      out.push((2 / 3) * (vx * DIRS[i].x + vy * DIRS[i].y) / KNOB_SENSE[i]);
    }
    return out;
  }

  /* ---- difficulty tiers ------------------------------------------------- */
  /* Tolerances and bubbleHump values are lifted verbatim from Stake-Out's
     LEVELS table so the two games grade the same. `setups` replaces Stake-Out's
     `points` (3/4/5/6) with 2/3/4/5 — levelling a tribrach takes longer than
     taking a shot, so the same count would make Level 4 a slog.

     The NAMES follow the v2 art package (Apprentice / Journeyman / Foreman /
     Shop Rocket). Only the labels moved: every number below is untouched, and
     the order is the same, so tier 4 is still the 3% ring it always was.

     dwellSec is the new idea and the whole win condition: the bubble has to
     STAY inside tolerance that long, continuously. Judged on the rendered
     position x, never on the target T, so overshoot costs you the hold. */
  var LEVELS = [
    { name: 'Apprentice',   setups: 2, bubbleTolerancePct: 30, bubbleHump: 0.50, dwellSec: 1.5 },
    { name: 'Journeyman',   setups: 3, bubbleTolerancePct: 18, bubbleHump: 0.75, dwellSec: 2.0 },
    { name: 'Foreman',      setups: 4, bubbleTolerancePct: 9,  bubbleHump: 0.75, dwellSec: 2.5 },
    { name: 'Shop Rocket',  setups: 5, bubbleTolerancePct: 3,  bubbleHump: 1.00, dwellSec: 3.0 }
  ];

  /* ---- spring / damper -------------------------------------------------- */
  /* Ported from Stake-Out's game-engine.js, same constants, same personality
     block. The only input that changed is where T comes from: three knobs
     instead of a pole-tilt cursor.

        a = k*(T - x) - c*v ;  v += a*dt ;  x += v*dt

     ONE deliberate departure. Stake-Out's target was a moving mouse, so its
     steady state was never actually steady and the per-frame jitter just added
     texture. Here the target goes perfectly still the moment you let go of a
     knob, which turns that same jitter into the only thing standing between
     you and a pass — and at tier 4's 3% ring, holding for three seconds
     against full jitter is not hard, it is a coin flip. So jitter fades out as
     the bubble settles near centre (see JITTER_FLOOR). Off-centre it is as
     lively as Stake-Out; parked dead centre it calms down like real fluid. */
  var SPRING_K   = 6;
  var DAMPING    = 0.75;
  var MAX_VEL    = 4.8;
  var JITTER     = 1.5;

  /* Below this offset (in vial radii) jitter is scaled down to JITTER_FLOOR,
     ramping linearly. 0.34 sits just outside tier 1's 30% ring, so every tier
     gets its calm zone at the same physical place on the glass. */
  var JITTER_CALM_AT = 0.34;
  var JITTER_FLOOR   = 0.18;

  var PERSONALITY      = 1.0;
  var ESCAPE_MULT      = 2.2;
  var RETURN_MULT      = 1.0;
  var ESCAPE_DAMP_MULT = 0.75;
  var RETURN_DAMP_MULT = 1.35;
  var SENSITIVITY_GAIN = 1.8;
  var SENSITIVITY_POW  = 1.5;

  function clampMag(v, max) {
    var m = Math.hypot(v.x, v.y);
    if (m > max && m > 0) { v.x = v.x / m * max; v.y = v.y / m * max; }
    return v;
  }

  function makeBubble(x, y) {
    return { x: x || 0, y: y || 0, vx: 0, vy: 0 };
  }

  /* One integration step. `rand` is injectable so tests can run the real
     integrator with jitter switched off and still exercise every other line. */
  function step(bubble, target, dt, lvl, rand) {
    var random = rand || Math.random;
    var t = { x: target.x, y: target.y };
    clampMag(t, 1);

    var targetMag = Math.hypot(t.x, t.y);
    var bubbleMag = Math.hypot(bubble.x, bubble.y);
    var escaping = targetMag > bubbleMag;
    var levelScale = 1 + lvl.bubbleHump * PERSONALITY;

    var stiffnessMult = 1 + ((escaping ? ESCAPE_MULT : RETURN_MULT) - 1) * PERSONALITY * levelScale;
    var dampMult      = 1 + ((escaping ? ESCAPE_DAMP_MULT : RETURN_DAMP_MULT) - 1) * PERSONALITY * levelScale;
    var sensitivity   = Math.pow(targetMag, SENSITIVITY_POW) * SENSITIVITY_GAIN * PERSONALITY * levelScale;

    var springK = SPRING_K * (1 + lvl.bubbleHump * 0.5) * stiffnessMult * (1 + sensitivity);
    var damping = (DAMPING / (1 + lvl.bubbleHump)) * dampMult;

    var ax = (t.x - bubble.x) * springK - bubble.vx * damping;
    var ay = (t.y - bubble.y) * springK - bubble.vy * damping;

    var calm = JITTER_FLOOR + (1 - JITTER_FLOOR) * Math.min(1, bubbleMag / JITTER_CALM_AT);
    var jit = lvl.bubbleHump * JITTER * calm;
    ax += (random() - 0.5) * jit;
    ay += (random() - 0.5) * jit;

    bubble.vx += ax * dt;
    bubble.vy += ay * dt;
    var vmag = Math.hypot(bubble.vx, bubble.vy);
    if (vmag > MAX_VEL) { bubble.vx = bubble.vx / vmag * MAX_VEL; bubble.vy = bubble.vy / vmag * MAX_VEL; }
    bubble.x += bubble.vx * dt;
    bubble.y += bubble.vy * dt;
    clampMag(bubble, 1);
    return bubble;
  }

  function offsetPct(bubble) { return Math.hypot(bubble.x, bubble.y) * 100; }

  root.TribrachSim = {
    PHI_DEG: PHI_DEG, DIRS: DIRS, KNOB_SENSE: KNOB_SENSE, K: K,
    MAX_TRAVEL_RAD: MAX_TRAVEL_RAD, LEVELS: LEVELS,
    targetFor: targetFor, screwsFor: screwsFor,
    makeBubble: makeBubble, step: step, offsetPct: offsetPct, clampMag: clampMag,
    TUNING: {
      SPRING_K: SPRING_K, DAMPING: DAMPING, MAX_VEL: MAX_VEL, JITTER: JITTER,
      JITTER_CALM_AT: JITTER_CALM_AT, JITTER_FLOOR: JITTER_FLOOR
    }
  };

<script id="tribrach-app">
/* ==========================================================================
   Renderer + game shell, v2 art package.
   --------------------------------------------------------------------------
   The screens are photo-real layer stacks, not procedural drawing any more.
   Two things still have to be painted every frame, because the art package
   ships them as single frozen states and the game needs every state:

     - the bubble, the knobs and the tolerance ring   -> #rig    (1000x1000)
     - the LCD digits and the hold-progress arc       -> #hudfx  (1920x1080)

   #rig is a SQUARE canvas covering the design rectangle the tribrach body
   occupies. Square matters: the knob drag maths measures angles, and a
   non-uniform scale would turn every circular gesture into an elliptical one
   and quietly skew the rotation the player gets for a given sweep.
   ========================================================================== */
(function () {
  'use strict';

  var SIM = window.TribrachSim;
  var $ = function (id) { return document.getElementById(id); };

  /* ====================================================================== */
  /* WHERE EVERYTHING IS                                                    */
  /* ====================================================================== */
  /* Design canvas both art packages were exported against. */
  var DESIGN_W = 1920, DESIGN_H = 1080;

  /* ---- the portrait start menu -----------------------------------------
     A 16:9 menu letterboxed into an upright phone is a band across the middle
     with about a fifth of the screen used. Stake-Out solves this by giving
     every screen its own aspect (--aw/--ah in its stylesheet; its menu is 5:4,
     its instrument 2:1) and TriBrach now does the same.

     The difference is that TriBrach's menu is not one baked image — every
     element is already its own sprite, so portrait does not need new art, just
     a second set of rectangles. Same sprites, taller canvas, stacked instead of
     side by side. Landscape is untouched and still uses the package's own
     positions.

     1200x2300 is deliberately much taller than Stake-Out's 5:4: at 5:4 a
     375x812 phone still only fills 37% of its height, where this fills 87%.

     `s` is a scale factor on the sprite's native size; `x` is worked out to
     centre it on the 1200-wide canvas. static_copy is dropped — there is no
     room for a 1792px-wide strip of micro-type, and the only part of it that
     carries information (TOOLS | SKILLS | REAL RESULTS) is already inside the
     TST lockup at the top. */
  var MENU_PORTRAIT = {
    w: 1200, h: 2300,
    photoH: 675,               // background scaled to width: 1200 * 1080/1920
    at: {
      startmenu_04_tst_return_button: { x: 36,  y: 30,   s: 0.800 },
      startmenu_02_tribrach:          { x: 195, y: 180,  s: 0.780 },
      startmenu_03_title_branding:    { x: 129, y: 860,  s: 1.100 },
      startmenu_05_apprentice_button: { x: 130, y: 1170, s: 1.433 },
      startmenu_06_journeyman_button: { x: 130, y: 1370, s: 1.433 },
      startmenu_07_foreman_button:    { x: 130, y: 1570, s: 1.433 },
      startmenu_08_shop_rocket_button:{ x: 130, y: 1770, s: 1.433 },
      startmenu_09_start_button:      { x: 190, y: 1990, s: 1.263 },
      startmenu_10_static_copy:       null
    }
  };

  /* Sprite rectangles on that canvas. Generated by tools/prep_layers.js and
     copied verbatim from its output — see assets/img/README.txt. Nothing here
     was placed by eye, which is why the stack registers without fiddling. */
  var SPRITES = {
    hud: {
      tribrach_01_static_ui:      { x: 0,    y: 0,   w: 1920, h: 1080 },
      tribrach_02_static_body:    { x: 475,  y: 45,  w: 970,  h: 982 },
      tribrach_03_level_glass:    { x: 733,  y: 207, w: 457,  h: 421 },
      knob_a:                     { x: 488,  y: 249, w: 174,  h: 174 },
      knob_b:                     { x: 1266, y: 247, w: 177,  h: 177 },
      knob_c:                     { x: 840,  y: 728, w: 239,  h: 239 },
      tribrach_05_bubble:         { x: 1011, y: 280, w: 124,  h: 124 },
      pct_offset:                 { x: 373,  y: 339, w: 53,   h: 55 },
      pct_hold:                   { x: 279,  y: 647, w: 45,   h: 47 },
      colon:                      { x: 229,  y: 198, w: 18,   h: 34 },
      tribrach_08_ui_text:        { x: 113,  y: 156, w: 1708, h: 708 },
      tribrach_09_branding:       { x: 58,   y: 27,  w: 1801, h: 998 },
      tribrach_10_escape_button:  { x: 1480, y: 407, w: 396,  h: 186 }
    },
    startmenu: {
      startmenu_01_background:        { x: 0,    y: 0,   w: 1920, h: 1080 },
      startmenu_02_tribrach:          { x: 54,   y: 127, w: 1038, h: 826 },
      startmenu_03_title_branding:    { x: 965,  y: 80,  w: 856,  h: 242 },
      startmenu_04_tst_return_button: { x: 51,   y: 21,  w: 384,  h: 156 },
      startmenu_05_apprentice_button: { x: 1207, y: 315, w: 656,  h: 129 },
      startmenu_06_journeyman_button: { x: 1207, y: 438, w: 656,  h: 128 },
      startmenu_07_foreman_button:    { x: 1207, y: 552, w: 656,  h: 129 },
      startmenu_08_shop_rocket_button:{ x: 1207, y: 666, w: 656,  h: 130 },
      startmenu_09_start_button:      { x: 1207, y: 765, w: 649,  h: 202 },
      startmenu_10_static_copy:       { x: 42,   y: 647, w: 1792, h: 370 }
    }
  };

  /* The square of design canvas #rig owns. Chosen so the body sprite
     (475,45 -> 1445,1027) sits comfortably inside with a little air, and so
     the side comes out at exactly 1000 — which makes the rig's logical unit
     and the design pixel the same size, and the scale factor between them 1. */
  var RIG = { x: 460, y: 30, side: 1000 };

  /* Everything below is in RIG-LOCAL units, i.e. design minus RIG's origin. */
  function local(s) { return { x: s.x - RIG.x, y: s.y - RIG.y, w: s.w, h: s.h }; }
  function centre(s) { var l = local(s); return { x: l.x + l.w / 2, y: l.y + l.h / 2 }; }

  var GLASS = local(SPRITES.hud.tribrach_03_level_glass);
  var VIAL = { x: GLASS.x + GLASS.w / 2, y: GLASS.y + GLASS.h / 2 };

  /* How far the bubble's centre may travel from the vial's, in rig units. The
     glass is very slightly elliptical (it is a perspective render), so the two
     axes differ; the physics stays a unit circle and the renderer stretches
     it, exactly like the old build stretched a unit circle to VIAL.r. */
  var BUBBLE_R = SPRITES.hud.tribrach_05_bubble.w / 2;
  var TRAVEL_X = GLASS.w / 2 - BUBBLE_R - 4;
  var TRAVEL_Y = GLASS.h / 2 - BUBBLE_R - 4;

  /* Knobs, in SIM.DIRS order: A upper-left, B upper-right, C bottom.

     The v3 art draws each knob straight down its axis, so the sprite is a TRUE
     CIRCLE — measured aspect 1.000, alpha filling the circumscribed circle to
     within 0.2% — and its crop is square. The middle of the bitmap is
     therefore the rotation axis, and spinning the whole sprite about that
     point is exactly right: the disc maps onto itself at every angle and the
     gear teeth carry the motion.

     Everything this block used to hold for foreshortening is gone with it. */
  var KNOB_ART = [SPRITES.hud.knob_a, SPRITES.hud.knob_b, SPRITES.hud.knob_c];
  var KNOBS = SIM.DIRS.map(function (d, i) {
    var art = KNOB_ART[i];
    var c = centre(art);
    var drawn = art.w / 2;
    return {
      id: d.id, i: i, x: c.x, y: c.y,
      art: local(art),
      r: drawn,
      /* Generous on purpose: the thumb target is much bigger than the knob
         looks on a desktop screen, and the two upper knobs are drawn smaller
         than the bottom one without being any less important. */
      hit: Math.max(drawn + 44, 122)
    };
  });

  /* The hold-progress ring, in DESIGN coordinates — it is painted on #hudfx,
     not on the rig. Centre and radii were fitted to the lit arc the art
     package ships (layer 07), which is why they are not round numbers. */
  var RING = { x: 271, y: 654, rIn: 101, rOut: 139, segs: 45, gapDeg: 1.6 };

  /* LCD slots, also design coordinates, measured off layer 06's baked sample
     values. gh is the glyph height to draw at. */
  var LCD = {
    /* colonsAt are the left/top of each colon GLYPH, not of its dots. */
    time:   { groups: [150, 246, 342], gw: 81, y: 186, gh: 50, colonsAt: [[229, 198], [324, 198]] },
    offset: { right: 368, y: 339, gh: 55, pct: SPRITES.hud.pct_offset },
    hold:   { cx: RING.x, y: 639, gh: 55, pct: SPRITES.hud.pct_hold }
  };


  /* ====================================================================== */
  /* SPRITE LOADING                                                         */
  /* ====================================================================== */
  /* WebP with a PNG beside it, the same arrangement Stake-Out uses. Every
     browser that matters reads WebP; the fallback is there so a stale one
     degrades to a slower load rather than a blank screen. */
  var IMAGES = {};
  function sprite(group, name) {
    var key = group + '/' + name;
    if (IMAGES[key]) return IMAGES[key];
    var img = new Image();
    img.decoding = 'async';
    img.addEventListener('error', function () {
      if (img.src.indexOf('.webp') >= 0) img.src = img.src.replace(/\.webp$/, '.png');
    });
    img.src = 'assets/img/' + group + '/' + name + '.webp';
    IMAGES[key] = img;
    return img;
  }
  function ready(img) { return img && img.complete && img.naturalWidth > 0; }

  /* The digit atlas is shared with Stake-Out so the two games read the same:
     three rows (green, yellow, red) of eleven 96x132 cells, 0-9 then '.'. */
  var atlas = new Image();
  atlas.addEventListener('error', function () {
    if (atlas.src.indexOf('.webp') >= 0) atlas.src = atlas.src.replace(/\.webp$/, '.png');
  });
  atlas.src = 'assets/img/lcd_digits.png';
  var CELL_W = 96, CELL_H = 132;
  var ATLAS_ROW = { green: 0, yellow: 1, red: 2 };
  var ADV_DIGIT = 0.60, ADV_DOT = 0.26;   // glyph advance as a fraction of height

  function glyphCell(ch) { return ch === '.' ? 10 : Number(ch); }

  function textWidth(text, gh) {
    var w = 0;
    for (var i = 0; i < text.length; i++) w += (text[i] === '.' ? ADV_DOT : ADV_DIGIT) * gh;
    return w;
  }

  /* Draw `text` (digits and '.') right-aligned so it ends at xRight. Ported
     from Stake-Out's ui-skin.js drawDigits, glyph metrics and all. */
  function drawDigits(c, text, xRight, yTop, gh, row) {
    if (!ready(atlas)) return;
    var sy = (ATLAS_ROW[row] || 0) * CELL_H;
    var cw = CELL_W * (gh / CELL_H);
    var x = xRight;
    for (var i = text.length - 1; i >= 0; i--) {
      var ch = text[i];
      var cell = glyphCell(ch);
      if (isNaN(cell)) continue;
      var adv = (ch === '.' ? ADV_DOT : ADV_DIGIT) * gh;
      // the dot sits centred in its narrower advance; digits hug the right
      var dx = ch === '.' ? x - adv / 2 - cw / 2 : x - cw + gh * 0.03;
      c.drawImage(atlas, cell * CELL_W, sy, CELL_W, CELL_H, dx, yTop, cw, gh);
      x -= adv;
    }
  }

  /* ====================================================================== */
  /* THE STAGE                                                              */
  /* ====================================================================== */
  var stage = $('stage');
  var activeScreen = 'menu';
  var menuMode = null;                 // 'landscape' | 'portrait'
  var menuEls = {};                    // sprite name -> element, for re-placing

  /* Which design canvas is live right now. Only the start menu ever changes
     shape: the play screen stays 1920x1080 because the rig's whole geometry —
     and the drag maths that depends on it — is pinned to that canvas. */
  function canvasNow() {
    if (activeScreen === 'menu' && window.innerHeight > window.innerWidth) {
      return { w: MENU_PORTRAIT.w, h: MENU_PORTRAIT.h, mode: 'portrait' };
    }
    return { w: DESIGN_W, h: DESIGN_H, mode: 'landscape' };
  }

  function layoutStage() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var cv = canvasNow();

    if (cv.mode !== menuMode) applyMenuMode(cv.mode);

    stage.style.width = cv.w + 'px';
    stage.style.height = cv.h + 'px';
    var s = Math.min(vw / cv.w, vh / cv.h);
    var ox = Math.round((vw - cv.w * s) / 2);
    var oy = Math.round((vh - cv.h * s) / 2);
    stage.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + s + ')';
    document.body.classList.toggle('is-portrait', vh > vw);
  }
  window.addEventListener('resize', layoutStage);
  window.addEventListener('orientationchange', function () { setTimeout(layoutStage, 80); });

  /* Move every menu element to the rectangle the current mode gives it.
     Landscape uses the package's own positions; portrait uses MENU_PORTRAIT. */
  function applyMenuMode(mode) {
    menuMode = mode;
    var p = MENU_PORTRAIT;

    Object.keys(menuEls).forEach(function (name) {
      var el = menuEls[name];
      var art = SPRITES.startmenu[name];

      if (mode === 'landscape') {
        el.style.display = '';
        setBox(el, art.x, art.y, art.w, art.h);
        return;
      }

      // the background is scaled to the canvas width and sits at the top, with
      // the fade below carrying it down into the dark — cropping it to cover a
      // canvas this tall would throw away the whole skyline
      if (name === 'startmenu_01_background') {
        el.style.display = '';
        setBox(el, 0, 0, p.w, p.photoH);
        return;
      }

      var at = p.at[name];
      if (!at) { el.style.display = 'none'; return; }
      el.style.display = '';
      setBox(el, at.x, at.y, Math.round(art.w * at.s), Math.round(art.h * at.s));
    });

    var fade = $('menuFade');
    if (fade) {
      if (mode === 'portrait') {
        setBox(fade, 0, 0, p.w, p.h);
        fade.style.display = 'block';
      } else {
        fade.style.display = 'none';
      }
    }
  }

  function setBox(el, x, y, w, h) {
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = w + 'px';
    el.style.height = h + 'px';
  }

  /* Build the decorative layers straight from the sprite table, so a layer can
     never drift out of register by being typed in twice. */
  function place(el, group, name) {
    var s = SPRITES[group][name];
    setBox(el, s.x, s.y, s.w, s.h);
    if (group === 'startmenu') menuEls[name] = el;
    return el;
  }

  function addLayer(screen, group, name, z) {
    var img = document.createElement('img');
    img.className = 'ly';
    img.alt = '';
    img.style.zIndex = z;
    place(img, group, name);
    img.addEventListener('error', function () {
      if (img.src.indexOf('.webp') >= 0) img.src = img.src.replace(/\.webp$/, '.png');
    });
    img.src = 'assets/img/' + group + '/' + name + '.webp';
    screen.appendChild(img);
    return img;
  }

  function artInto(btn, group, name, z) {
    place(btn, group, name);
    btn.style.zIndex = z;
    var img = document.createElement('img');
    img.alt = '';
    img.addEventListener('error', function () {
      if (img.src.indexOf('.webp') >= 0) img.src = img.src.replace(/\.webp$/, '.png');
    });
    img.src = 'assets/img/' + group + '/' + name + '.webp';
    btn.insertBefore(img, btn.firstChild);
    return btn;
  }

  /* ====================================================================== */
  /* STATE                                                                  */
  /* ====================================================================== */
  var levelIndex = 0;
  var setupNum = 1;
  var turns = [0, 0, 0];      // raw clockwise knob rotation, radians
  var bubble = SIM.makeBubble(0, 0);
  var holdSec = 0;
  var rows = [];
  var running = false;
  var setupStartMs = 0;
  var levelStartMs = 0;
  var activeKnob = null;
  var lastAngle = 0;
  var paused = false;
  var pausedAt = 0;
  var armedLog = false;
  var armedTimer = null;
  var rafId = null;
  var lastT = null;

  var canvas = $('rig');
  var ctx = canvas.getContext('2d');
  var rigScale = 1;

  var fx = $('hudfx');
  var fxCtx = fx.getContext('2d');
  var fxScale = 1;

  var FINE_GEAR = 0.2;        // hold Shift while dragging for 5x finer control

  /* ====================================================================== */
  /* SCREENS                                                                */
  /* ====================================================================== */
  function show(name) {
    ['menu', 'play', 'report'].forEach(function (s) {
      $('screen-' + s).classList.toggle('is-on', s === name);
    });
    document.body.classList.toggle('is-playing', name === 'play');
    document.body.classList.toggle('is-menu', name === 'menu');
    /* The menu and the play screen sit on different design canvases in
       portrait, so the stage has to be re-measured on every screen change and
       not only when the window moves. */
    activeScreen = name;
    layoutStage();
    if (name === 'play') { requestAnimationFrame(resize); }
  }

  /* ---- menu ------------------------------------------------------------- */
  /* One art plate per tier, in the package's own order, which is already the
     tier order. The plate carries the label, so the only thing the button adds
     is the accessible name and the selected state. */
  var TIER_ART = [
    'startmenu_05_apprentice_button',
    'startmenu_06_journeyman_button',
    'startmenu_07_foreman_button',
    'startmenu_08_shop_rocket_button'
  ];

  function buildMenu() {
    var menu = $('screen-menu');
    addLayer(menu, 'startmenu', 'startmenu_01_background', 0);
    addLayer(menu, 'startmenu', 'startmenu_02_tribrach', 2);
    addLayer(menu, 'startmenu', 'startmenu_03_title_branding', 3);

    artInto($('tstBtn'), 'startmenu', 'startmenu_04_tst_return_button', 4);

    var list = $('lvlList');
    list.innerHTML = '';
    SIM.LEVELS.forEach(function (lvl, i) {
      var b = document.createElement('button');
      b.className = 'artbtn lvl';
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', String(i === levelIndex));
      b.setAttribute('aria-label',
        lvl.name + ' — ' + lvl.setups + ' setups, tolerance ' +
        lvl.bubbleTolerancePct + ' percent, hold ' + lvl.dwellSec + ' seconds');
      artInto(b, 'startmenu', TIER_ART[i], 5 + i);
      b.addEventListener('click', function () {
        levelIndex = i;
        Array.prototype.forEach.call(list.children, function (c, j) {
          c.setAttribute('aria-checked', String(j === i));
        });
      });
      list.appendChild(b);
    });

    artInto($('startBtn'), 'startmenu', 'startmenu_09_start_button', 9);
    addLayer(menu, 'startmenu', 'startmenu_10_static_copy', 10);
  }

  /* ---- play ------------------------------------------------------------- */
  function buildPlay() {
    var play = $('screen-play');
    addLayer(play, 'hud', 'tribrach_01_static_ui', 1);

    canvas.style.left = RIG.x + 'px';
    canvas.style.top = RIG.y + 'px';
    canvas.style.width = RIG.side + 'px';
    canvas.style.height = RIG.side + 'px';
    canvas.style.zIndex = 2;

    fx.style.left = '0px';
    fx.style.top = '0px';
    fx.style.width = DESIGN_W + 'px';
    fx.style.height = DESIGN_H + 'px';
    fx.style.zIndex = 3;

    addLayer(play, 'hud', 'tribrach_08_ui_text', 4);
    addLayer(play, 'hud', 'tribrach_09_branding', 5);
    artInto($('quitBtn'), 'hud', 'tribrach_10_escape_button', 6);

    // the overlay readouts and LOG AS-IS sit above the art
    ['hudLevel', 'hudSetup', 'hudTol', 'logBtn'].forEach(function (id) {
      $(id).style.zIndex = 7;
    });
  }

  /* ====================================================================== */
  /* ROUND FLOW                                                             */
  /* ====================================================================== */
  function startLevel() {
    setupNum = 1;
    rows = [];
    levelStartMs = Date.now();
    running = true;
    show('play');
    newSetup();
    if (rafId === null) rafId = requestAnimationFrame(loop);
  }

  /* A fresh setup = the plate arrives already out of level, the way a tripod
     does. Pick where the bubble should sit, solve back to screw positions, then
     slide all three screws by a common amount. That common slide is the null
     space of the whole system (criterion 3 again) so it changes nothing about
     the bubble — it just stops every setup from looking symmetrical. */
  function newSetup() {
    var lvl = SIM.LEVELS[levelIndex];
    var ang = Math.random() * Math.PI * 2;
    var mag = 0.55 + Math.random() * 0.37;
    var tx = Math.cos(ang) * mag, ty = Math.sin(ang) * mag;

    var q = SIM.screwsFor(tx, ty);
    var common = (Math.random() - 0.5) * 2.2;
    turns = q.map(function (v) {
      return Math.max(-SIM.MAX_TRAVEL_RAD, Math.min(SIM.MAX_TRAVEL_RAD, v + common));
    });

    var T = SIM.targetFor(turns[0], turns[1], turns[2]);
    bubble = SIM.makeBubble(T.x, T.y);   // already settled where the tilt puts it
    holdSec = 0;
    setupStartMs = Date.now();
    disarmLog();
    $('hudLevel').textContent = lvl.name;
    $('hudSetup').textContent = 'SETUP ' + setupNum + ' OF ' + lvl.setups;
    $('hudTol').textContent = 'TOL ' + lvl.bubbleTolerancePct + '%  ·  HOLD ' + lvl.dwellSec + 's';
  }

  function finishSetup(pass, note) {
    var lvl = SIM.LEVELS[levelIndex];
    rows.push({
      setup: setupNum,
      sec: (nowMs() - setupStartMs) / 1000,
      offset: SIM.offsetPct(bubble),
      pass: pass,
      note: note
    });
    toast(pass ? '✔ LEVEL — SETUP ACCEPTED' : '✘ ' + note, pass);
    disarmLog();

    if (setupNum >= lvl.setups) {
      running = false;
      setTimeout(endLevel, 750);
    } else {
      setupNum++;
      running = false;
      setTimeout(function () { running = true; newSetup(); }, 650);
    }
  }

  function endLevel() {
    running = false;
    renderTicket();
    show('report');
  }

  /* ====================================================================== */
  /* INPUT — one pointer path for mouse, pen and touch. No touch-only branch */
  /* exists, which is the entire reason this works on a phone.              */
  /* ====================================================================== */
  function pointOf(e) {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;   // no layout box yet
    return {
      x: (e.clientX - rect.left) / rect.width * RIG.side,
      y: (e.clientY - rect.top) / rect.height * RIG.side
    };
  }

  function knobAt(p) {
    var best = null, bestD = Infinity;
    for (var i = 0; i < KNOBS.length; i++) {
      var d = Math.hypot(p.x - KNOBS[i].x, p.y - KNOBS[i].y);
      if (d < KNOBS[i].hit && d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function onDown(e) {
    if (!running) return;
    var p = pointOf(e);
    if (!p) return;
    var k = knobAt(p);
    if (k === null) return;
    activeKnob = k;
    lastAngle = Math.atan2(p.y - KNOBS[k].y, p.x - KNOBS[k].x);
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('is-turning');
    e.preventDefault();
  }

  function onMove(e) {
    if (activeKnob === null || !running) return;
    var p = pointOf(e);
    if (!p) return;
    var k = KNOBS[activeKnob];
    var dx = p.x - k.x, dy = p.y - k.y;

    /* Right at the spindle the angle is meaningless and jumps wildly. Re-seat
       the reference instead of applying garbage. */
    if (Math.hypot(dx, dy) < 22) return;

    var a = Math.atan2(dy, dx);
    var d = a - lastAngle;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    lastAngle = a;

    if (e.shiftKey) d *= FINE_GEAR;   // desktop precision, free

    var next = turns[activeKnob] + d;
    turns[activeKnob] = Math.max(-SIM.MAX_TRAVEL_RAD, Math.min(SIM.MAX_TRAVEL_RAD, next));
    e.preventDefault();
  }

  function onUp(e) {
    if (activeKnob === null) return;
    activeKnob = null;
    canvas.classList.remove('is-turning');
    canvas.releasePointerCapture && e.pointerId !== undefined &&
      canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId) &&
      canvas.releasePointerCapture(e.pointerId);
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('lostpointercapture', onUp);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ====================================================================== */
  /* SIMULATION LOOP                                                        */
  /* ====================================================================== */
  function update(dt) {
    var lvl = SIM.LEVELS[levelIndex];
    var T = SIM.targetFor(turns[0], turns[1], turns[2]);
    SIM.step(bubble, T, dt, lvl);

    /* Pass/fail is judged on the RENDERED position, never on the target. A
       bubble that is merely aimed at centre has not been levelled; one that is
       sitting at centre has. That gap is the lag and overshoot, and it is the
       whole game. */
    var off = SIM.offsetPct(bubble);
    if (off <= lvl.bubbleTolerancePct) holdSec += dt; else holdSec = 0;
    if (holdSec >= lvl.dwellSec) finishSetup(true, '');
  }

  function loop(t) {
    if (lastT === null) lastT = t;
    var dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    if (running && !paused) update(dt);
    draw();
    paintHud();
    rafId = requestAnimationFrame(loop);
  }

  /* While paused, "now" stops advancing. Without this the sim freezes but the
     readout keeps counting up, and the clock only snaps back on resume — which
     looks exactly like a bug to the player watching it. */
  function nowMs() { return paused ? pausedAt : Date.now(); }

  /* Pausing has to move the clock forward with it, or a player who takes a
     phone call comes back to a stopwatch that says they spent four minutes on
     one setup. Both the level clock and the per-setup clock get shifted by
     however long we were away. */
  function setPaused(p) {
    p = !!p;
    if (p === paused) return;
    paused = p;
    if (paused) {
      pausedAt = Date.now();
    } else {
      var gap = Date.now() - pausedAt;
      levelStartMs += gap;
      setupStartMs += gap;
      lastT = null;               // don't hand the loop one enormous dt
    }
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) setPaused(true); else setPaused(false);
  });
  window.addEventListener('blur', function () { activeKnob = null; });

  /* ====================================================================== */
  /* HUD                                                                    */
  /* ====================================================================== */
  /* The art's TIME readout is three two-digit groups, so the clock reads
     HH:MM:SS. Only the formatting changed; the value is the same elapsed
     milliseconds it always was. The field report still uses tenths. */
  function fmtHMS(sec) {
    var s = Math.max(0, Math.floor(sec));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(h) + ':' + p(m) + ':' + p(ss);
  }

  function fmtClock(sec) {
    var m = Math.floor(sec / 60), s = sec - m * 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
  }

  function paintHud() {
    if (!$('screen-play').classList.contains('is-on')) return;
    var lvl = SIM.LEVELS[levelIndex];
    var el = (nowMs() - levelStartMs) / 1000;
    var off = SIM.offsetPct(bubble);

    /* The DOM mirrors are the accessible truth and what the tests read; the
       canvas glyphs below are the same numbers dressed up. */
    $('hudClock').textContent = fmtHMS(el);
    $('rdOffset').textContent = off.toFixed(1) + '% from centre';
    $('rdHold').textContent = holdSec.toFixed(1) + 's of ' + lvl.dwellSec + 's held';

    paintFx(el, off, lvl);
  }

  /* ---- the live HUD layers (06 LCD + 07 hold fill) ---------------------- */
  function paintFx(elapsedSec, off, lvl) {
    var rect = fx.getBoundingClientRect();
    if (!rect.width) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var w = Math.max(1, Math.round(rect.width * dpr));
    if (fx.width !== w) {
      fx.width = w;
      fx.height = Math.round(w * DESIGN_H / DESIGN_W);
      fxScale = w / DESIGN_W;
    }
    var c = fxCtx;
    c.setTransform(fxScale, 0, 0, fxScale, 0, 0);
    c.clearRect(0, 0, DESIGN_W, DESIGN_H);

    /* TIME — three groups, right-aligned inside their own slot so the digits
       sit where the baked art had them. */
    var hms = fmtHMS(elapsedSec).split(':');
    for (var g = 0; g < 3; g++) {
      drawDigits(c, hms[g], LCD.time.groups[g] + LCD.time.gw, LCD.time.y, LCD.time.gh, 'green');
    }
    var colon = sprite('hud', 'colon');
    if (ready(colon)) {
      var cs = SPRITES.hud.colon;
      LCD.time.colonsAt.forEach(function (p) {
        c.drawImage(colon, p[0], p[1], cs.w, cs.h);
      });
    }

    /* BUBBLE OFFSET — value in the digit atlas, '%' as the sprite cut out of
       the art so the sign matches the rest of the panel exactly. */
    var txt = off.toFixed(1);
    drawDigits(c, txt, LCD.offset.right, LCD.offset.y, LCD.offset.gh, 'green');
    var pO = sprite('hud', 'pct_offset');
    if (ready(pO)) c.drawImage(pO, LCD.offset.pct.x, LCD.offset.pct.y, LCD.offset.pct.w, LCD.offset.pct.h);

    /* HOLD TO COMPLETE — the segmented ring, then the percentage in the middle.
       The grey track is already in layer 01, so only the lit part is drawn. */
    var frac = Math.max(0, Math.min(1, holdSec / lvl.dwellSec));
    drawHoldRing(c, frac);

    var pctNum = Math.round(frac * 100);
    var pH = LCD.hold.pct;
    var numW = textWidth(String(pctNum), LCD.hold.gh);
    var groupW = numW + pH.w;
    var x0 = LCD.hold.cx - groupW / 2;
    drawDigits(c, String(pctNum), x0 + numW, LCD.hold.y, LCD.hold.gh, 'green');
    var pHimg = sprite('hud', 'pct_hold');
    if (ready(pHimg)) c.drawImage(pHimg, x0 + numW + 4, pH.y, pH.w, pH.h);
  }

  /* The lit arc. Segmented like the track underneath it, starting at twelve
     o'clock and filling clockwise — the same direction and origin the old
     procedural ring used, so the motion reads identically. */
  function drawHoldRing(c, frac) {
    if (frac <= 0) return;
    var total = RING.segs;
    var lit = frac * total;
    var pitch = 360 / total;
    var gap = RING.gapDeg;
    var mid = (RING.rIn + RING.rOut) / 2;

    c.save();
    c.lineWidth = RING.rOut - RING.rIn;
    c.lineCap = 'butt';
    c.shadowColor = 'rgba(150,250,40,0.55)';
    c.shadowBlur = 14;
    for (var i = 0; i < total; i++) {
      var amount = Math.max(0, Math.min(1, lit - i));
      if (amount <= 0) break;
      var a0 = -90 + i * pitch + gap / 2;
      var a1 = a0 + (pitch - gap) * amount;
      c.strokeStyle = 'rgb(' + Math.round(146 + 22 * amount) + ',' +
                      Math.round(249 + 5 * amount) + ',' +
                      Math.round(24 + 18 * amount) + ')';
      c.beginPath();
      c.arc(RING.x, RING.y, mid, a0 * Math.PI / 180, a1 * Math.PI / 180);
      c.stroke();
    }
    c.restore();
  }

  var toastTimer = null;
  function toast(msg, good) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast is-on ' + (good ? 'ok' : 'no');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, 1500);
  }

  /* ====================================================================== */
  /* RENDER — the rig                                                       */
  /* ====================================================================== */
  function resize() {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var w = Math.max(1, Math.round(rect.width * dpr));
    if (canvas.width === w) return;
    canvas.width = w;
    canvas.height = w;
    rigScale = w / RIG.side;
  }
  window.addEventListener('resize', resize);

  function draw() {
    resize();
    ctx.setTransform(rigScale, 0, 0, rigScale, 0, 0);
    ctx.clearRect(0, 0, RIG.side, RIG.side);

    var body = sprite('hud', 'tribrach_02_static_body');
    var bl = local(SPRITES.hud.tribrach_02_static_body);
    if (ready(body)) ctx.drawImage(body, bl.x, bl.y, bl.w, bl.h);

    var glass = sprite('hud', 'tribrach_03_level_glass');
    if (ready(glass)) ctx.drawImage(glass, GLASS.x, GLASS.y, GLASS.w, GLASS.h);

    drawToleranceRing(ctx);
    drawBubble(ctx);
    KNOBS.forEach(function (k) { drawKnob(ctx, k); });
  }

  /* This level's pass ring. Not in the art package — the plates are one per
     screen, not one per tier — but without it the player has no idea how close
     "close enough" is, so it is drawn over the glass the way the old build
     drew it: dashed, yellow until you are inside it, white once you are. */
  function drawToleranceRing(c) {
    var lvl = SIM.LEVELS[levelIndex];
    var inTol = SIM.offsetPct(bubble) <= lvl.bubbleTolerancePct;
    var f = lvl.bubbleTolerancePct / 100;

    c.save();
    c.setLineDash([9, 8]);
    c.lineWidth = 3;
    c.strokeStyle = inTol ? 'rgba(255,255,255,0.95)' : 'rgba(30,30,20,0.72)';
    c.beginPath();
    c.ellipse(VIAL.x, VIAL.y, Math.max(7, TRAVEL_X * f), Math.max(7, TRAVEL_Y * f), 0, 0, Math.PI * 2);
    c.stroke();
    c.restore();
  }

  /* THE BUBBLE. Physics is +y up, the canvas is +y down — hence the minus. */
  function drawBubble(c) {
    var img = sprite('hud', 'tribrach_05_bubble');
    if (!ready(img)) return;
    var s = SPRITES.hud.tribrach_05_bubble;
    var bx = VIAL.x + bubble.x * TRAVEL_X;
    var by = VIAL.y - bubble.y * TRAVEL_Y;
    c.drawImage(img, bx - s.w / 2, by - s.h / 2, s.w, s.h);
  }

  /* The knob is a true circle drawn down its own axis, so it simply turns.

     This is worth a note only because the two earlier art passes were NOT
     circles, and neither could be rotated correctly. They were three-quarter
     views: the cap was an ellipse, which does not map onto itself when you
     spin it in the screen plane, and the knurl was the side wall of a
     cylinder, which no rotation of a flat bitmap moves correctly at all.
     Working around that needed an un-squash / rotate / re-squash through a
     padded scratch canvas, with the skirt held still and only the cap face
     turning. Face-on art deletes the entire problem — the sprite maps onto
     itself at every angle and the gear teeth carry the motion by themselves. */
  function drawKnob(c, k) {
    var img = sprite('hud', 'knob_' + k.id.toLowerCase());
    var a = turns[k.i];

    if (ready(img)) {
      c.save();
      c.translate(k.x, k.y);
      c.rotate(a);
      c.drawImage(img, -k.art.w / 2, -k.art.h / 2, k.art.w, k.art.h);
      c.restore();
    }

    /* Index tick, at twelve o'clock when the screw is at zero. The teeth show
       that the knob is turning, but there are twenty-odd of them and they all
       look alike, so they cannot show HOW FAR it has turned. This can. It sits
       on the brushed face, inside the art's own yellow ring — put it on the
       ring and the two yellows muddle into each other. */
    var tr = k.r * 0.55;
    var tx = k.x + Math.sin(a) * tr;
    var ty = k.y - Math.cos(a) * tr;
    c.save();
    c.fillStyle = activeKnob === k.i ? '#ffe680' : '#f5c218';
    c.shadowColor = 'rgba(245,194,24,0.85)';
    c.shadowBlur = activeKnob === k.i ? 16 : 8;
    c.beginPath();
    c.arc(tx, ty, k.r * 0.075, 0, Math.PI * 2);
    c.fill();
    c.restore();

    // at the stops, say so rather than just going dead under the finger
    if (Math.abs(a) >= SIM.MAX_TRAVEL_RAD - 1e-6) {
      c.save();
      c.strokeStyle = 'rgba(255,90,90,0.9)';
      c.lineWidth = 4;
      c.beginPath();
      c.arc(k.x, k.y, k.r * 0.93, 0, Math.PI * 2);
      c.stroke();
      c.restore();
    }
  }

  /* ====================================================================== */
  /* FIELD REPORT                                                           */
  /* ====================================================================== */
  function renderTicket() {
    var lvl = SIM.LEVELS[levelIndex];
    var passed = rows.filter(function (r) { return r.pass; }).length;
    var total = (nowMs() - levelStartMs) / 1000;
    var now = new Date();

    var body = rows.map(function (r) {
      return '<tr>' +
        '<td>' + String(r.setup).padStart(3, '0') + '</td>' +
        '<td>' + r.sec.toFixed(1) + 's</td>' +
        '<td>' + r.offset.toFixed(1) + '%</td>' +
        '<td class="' + (r.pass ? 'p' : 'f') + '">' +
          (r.pass ? 'LEVEL' : (r.note || 'OUT')) + '</td>' +
      '</tr>';
    }).join('');

    $('ticket').innerHTML =
      '<div class="th">' +
        '<div class="t">TRIBRACH LEVELLING RECORD</div>' +
        '<div class="s">' + lvl.name.toUpperCase() +
          ' &nbsp;·&nbsp; TOL ' + lvl.bubbleTolerancePct + '%' +
          ' &nbsp;·&nbsp; HOLD ' + lvl.dwellSec + 's' +
          ' &nbsp;·&nbsp; ' + now.toLocaleString() + '</div>' +
      '</div>' +
      '<table><thead><tr><th>SETUP</th><th>TIME</th><th>FINAL OFFSET</th><th>RESULT</th></tr></thead>' +
      '<tbody>' + body + '</tbody></table>' +
      '<div class="tot"><span>' + passed + ' / ' + rows.length + ' ACCEPTED</span>' +
      '<span>TOTAL ' + fmtClock(total) + '</span></div>';
  }

  /* ====================================================================== */
  /* BUTTONS                                                                */
  /* ====================================================================== */
  function disarmLog() {
    armedLog = false;
    clearTimeout(armedTimer);
    $('logBtn').textContent = 'LOG AS-IS';
    $('logBtn').classList.remove('armed');
  }

  /* Two-press, because one stray thumb should not throw away a setup you have
     been fighting for forty seconds. Logging as-is is always a fail: the hold
     is the only way to pass, or the dwell mechanic means nothing. */
  $('logBtn').addEventListener('click', function () {
    if (!running) return;
    if (!armedLog) {
      armedLog = true;
      $('logBtn').textContent = 'CONFIRM — LOG UNLEVEL';
      $('logBtn').classList.add('armed');
      armedTimer = setTimeout(disarmLog, 3000);
      return;
    }
    finishSetup(false, 'LOGGED UNLEVEL');
  });

  /* ESCAPE TO MAIN MENU — the art package's new button, wired to the flow that
     already existed for leaving a level. Walk away with nothing logged and you
     land back on the menu; walk away part-way through and you still get the
     field report for the setups you did finish, which is what it always did. */
  $('quitBtn').addEventListener('click', function () {
    running = false;
    disarmLog();
    if (rows.length) { renderTicket(); show('report'); } else { show('menu'); }
  });

  $('startBtn').addEventListener('click', startLevel);
  $('againBtn').addEventListener('click', startLevel);
  $('menuBtn').addEventListener('click', function () { show('menu'); });

  /* ====================================================================== */
  /* BOOT                                                                   */
  /* ====================================================================== */
  buildMenu();
  buildPlay();
  layoutStage();
  show('menu');

  /* A read-only window into live state, for console poking and for the
     Playwright acceptance tests. Setters are deliberately limited to the three
     things a test needs to drive: which level, where the knobs are, and a
     single deterministic step. */
  window.TribrachGame = {
    get level() { return levelIndex; },
    get turns() { return turns.slice(); },
    get bubble() { return { x: bubble.x, y: bubble.y }; },
    get offsetPct() { return SIM.offsetPct(bubble); },
    get holdSec() { return holdSec; },
    get rows() { return rows.slice(); },
    get running() { return running; },
    get paused() { return paused; },
    setPaused: setPaused,
    setLevel: function (i) { levelIndex = i; },
    setTurns: function (a, b, cc) { turns = [a, b, cc]; },
    resetBubble: function (x, y) { bubble = SIM.makeBubble(x || 0, y || 0); holdSec = 0; },
    stepN: function (n, dt, noJitter) {
      var lvl = SIM.LEVELS[levelIndex];
      var T = SIM.targetFor(turns[0], turns[1], turns[2]);
      var rnd = noJitter ? function () { return 0.5; } : null;
      for (var i = 0; i < n; i++) SIM.step(bubble, T, dt || 1 / 60, lvl, rnd);
      return { x: bubble.x, y: bubble.y };
    },
    knobPositions: function () { return KNOBS.map(function (k) { return { id: k.id, x: k.x, y: k.y }; }); },
    startLevel: startLevel
  };
})();
</script>
</body>
</html>
